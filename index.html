<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA GPS Link</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #38bdf8; padding: 20px; text-align: center; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 14px 20px; font-weight: bold; border-radius: 8px; width: 100%; margin: 8px 0; font-size: 16px; }
    .card { background: #1e293b; padding: 16px; border-radius: 10px; margin-top: 15px; font-size: 14px; text-align: left; }
  </style>
</head>
<body>
  <h2>AURA GPS Gateway</h2>
  <button onclick="startGPS()">1. ACQUIRE GPS</button>
  <button onclick="connectBLE()">2. CONNECT TO ESP32</button>

  <div class="card">
    <div>BLE: <b id="bleStatus" style="color:#ef4444">Disconnected</b></div>
    <div>Packets: <span id="txCount">0</span></div>
    <div>Lat: <span id="lat">0.000000</span></div>
    <div>Lon: <span id="lon">0.000000</span></div>
    <div>Speed: <span id="spd">0.0</span> km/h</div>
  </div>

  <script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    let rxChar = null, lat = 0.0, lon = 0.0, spd = 0.0, count = 0;

    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(pos => {
          lat = pos.coords.latitude;
          lon = pos.coords.longitude;
          spd = (pos.coords.speed || 0.0) * 3.6;
          document.getElementById("lat").innerText = lat.toFixed(6);
          document.getElementById("lon").innerText = lon.toFixed(6);
          document.getElementById("spd").innerText = spd.toFixed(1);
        }, err => alert(err.message), { enableHighAccuracy: true });
      }
    }

    async function connectBLE() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "AURA_ESP32" }],
          optionalServices: [SERVICE_UUID]
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxChar = await service.getCharacteristic(CHAR_UUID);
        document.getElementById("bleStatus").innerText = "Streaming Active";
        document.getElementById("bleStatus").style.color = "#22c55e";

        // Stream GPS every 200ms
        setInterval(async () => {
          if (!rxChar) return;
          const payload = `${lat.toFixed(6)},${lon.toFixed(6)},${spd.toFixed(1)}\n`;
          const enc = new TextEncoder().encode(payload);
          try {
            if (rxChar.writeValueWithoutResponse) await rxChar.writeValueWithoutResponse(enc);
            else await rxChar.writeValue(enc);
            count++;
            document.getElementById("txCount").innerText = count;
          } catch(e) {}
        }, 200);
      } catch(err) { alert("BLE Error: " + err.message); }
    }
  </script>
</body>
</html>
