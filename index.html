<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadMon V2V Client</title>
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 20px; }
        h2 { color: #4CAF50; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin: 20px auto; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.1em; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .val { color: #03dac6; font-weight: bold; }
        button { background-color: #bb86fc; color: #000; border: none; padding: 15px 30px; font-size: 1.2em; border-radius: 30px; font-weight: bold; width: 100%; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:active { transform: scale(0.95); }
        #status { color: #cf6679; margin-top: 15px; font-size: 0.9em; }
    </style>
</head>
<body>
    <h2>RoadMon GPS Link</h2>
    
    <div class="card">
        <div class="data-row"><span>Speed:</span> <span class="val" id="spd">0.0 km/h</span></div>
        <div class="data-row"><span>Heading:</span> <span class="val" id="hdg">0.0°</span></div>
        <div class="data-row"><span>Accuracy:</span> <span class="val" id="acc">0.0 m</span></div>
        <div class="data-row" style="font-size: 0.9em; color:#aaa;"><span>Lat/Lon:</span> <span id="coords">Waiting...</span></div>
    </div>

    <div class="card">
        <button id="connectBtn">Connect to ESP32</button>
        <div id="status">Disconnected</div>
    </div>

    <script>
        const SERVICE_UUID = "12345678-1234-5678-1234-56789abcdef0";
        const CHAR_UUID = "12345678-1234-5678-1234-56789abcdef1";
        
        let bleCharacteristic = null;
        let watchId = null;
        let wakeLock = null;

        const btn = document.getElementById('connectBtn');
        const status = document.getElementById('status');

        // Request Screen Wakelock so phone doesn't sleep on dashboard
        async function requestWakeLock() {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { console.log("WakeLock error:", err); }
        }

        btn.addEventListener('click', async () => {
            if (bleCharacteristic) return; // Already connected
            
            try {
                status.innerText = "Requesting Bluetooth...";
                status.style.color = "#bb86fc";
                
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'RoadMon_ESP32' }],
                    optionalServices: [SERVICE_UUID]
                });

                device.addEventListener('gattserverdisconnected', onDisconnect);

                status.innerText = "Connecting to GATT Server...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHAR_UUID);
                
                status.innerText = "Connected! Starting GPS...";
                status.style.color = "#4CAF50";
                btn.innerText = "Connected";
                btn.style.backgroundColor = "#4CAF50";
                
                requestWakeLock();
                startGPS();
            } catch (error) {
                status.innerText = "Error: " + error;
                status.style.color = "#cf6679";
            }
        });

        function onDisconnect() {
            status.innerText = "Disconnected from ESP32";
            status.style.color = "#cf6679";
            btn.innerText = "Reconnect";
            btn.style.backgroundColor = "#bb86fc";
            bleCharacteristic = null;
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (wakeLock) wakeLock.release();
        }

        function startGPS() {
            if (!("geolocation" in navigator)) {
                status.innerText = "Geolocation not supported!";
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const spd = position.coords.speed || 0;     // meters per sec
                    const hdg = position.coords.heading || 0;   // degrees
                    const acc = position.coords.accuracy;       // meters

                    // Update UI
                    document.getElementById('coords').innerText = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                    document.getElementById('spd').innerText = `${(spd * 3.6).toFixed(1)} km/h`;
                    document.getElementById('hdg').innerText = `${hdg.toFixed(1)}°`;
                    document.getElementById('acc').innerText = `±${acc.toFixed(1)} m`;

                    // Send to ESP32 if connected
                    if (bleCharacteristic) {
                        const csvPayload = `${lat},${lon},${spd},${hdg},${acc}`;
                        const encoder = new TextEncoder();
                        // writeValueWithoutResponse is ultra-fast, no ACKs required
                        bleCharacteristic.writeValueWithoutResponse(encoder.encode(csvPayload)).catch(err => console.log(err));
                    }
                },
                (error) => { console.log(error); },
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
